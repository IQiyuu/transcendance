#Trong, the project

services:
  website:
    pull_policy: build
    build:
      context: ${SRCS}${WEBSITE_SERVICE}
      args:
        - NODE_VERSION=${NODE_VERSION}
        - PORT=${PORT}
    image : ${WEBSITE_SERVICE_IMAGE}
    container_name: pong-${WEBSITE_SERVICE}
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=${DEV_ENV}
    volumes:
      - db:${LOCATION_DB}
      - scripts:${LOCATION_SCRIPTS}
    secrets:
      - SSL-certificate
      - SSL-key
      - API-secret
      - key
    networks:
      - pong
    hostname : "Trong"

networks:
  pong:

volumes:
  db:
    driver: local
    driver_opts:
      type: none
      device: ${VOLUME_DB}
      o: "bind"
    name: ${DB_SERVICE}

  scripts:
    driver: local
    driver_opts:
      type: none
      device: ${VOLUME_SCRIPTS}
      o: "bind"
    name: ${WEBSITE_SERVICE}

  monitoring-logs:
    name: pong-${MONITORING_SERVICE}

configs:
  prometheus-config:
    file: ${SRCS_MONITORING_CONFIG}
  grafana-config:
    file: ${SRCS_MONITORING_VIS_CONFIG}
  # fastify-config:
  #   file: ${SRCS_FASTIFY_CONFIG}
  # fastify-tsconfig:
  #   file: ${SRCS_FASTIFY_TSCONFIG}

secrets:
  SSL-certificate:
    file: ${SECRETS}${SSL_CERTIFICATE}
  SSL-key:
    file: ${SECRETS}${SSL_KEY}
  API-secret:
    file: ${SECRETS}${API_SECRET}
  key:
    file: ${SECRETS}${SECRET_KEY}
